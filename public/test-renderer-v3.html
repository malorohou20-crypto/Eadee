  var issues = [];
  var checks = [];

    var ok = false;
    try { ok = !!test(); } catch(e) { ok = false; }

    if (!ok) issues.push({ label: label, critical: critical });

  // 1. Double score
  chk('score_viabilite présent et non nul',
    function(){ return plan.scores && plan.scores.score_viabilite && plan.scores.score_viabilite.note > 0; }, true);
  chk('score_bancabilite présent et non nul',
    function(){ return plan.scores && plan.scores.score_bancabilite && plan.scores.score_bancabilite.note > 0; }, true);
  chk('score_viabilite.detail a 6 critères',
    function(){ return Object.keys(plan.scores.score_viabilite.detail).length === 6; }, false);
  chk('score_bancabilite.detail a 6 critères',
    function(){ return Object.keys(plan.scores.score_bancabilite.detail).length === 6; }, false);

  // 2. Plan financement équilibré
  chk('plan_financement.besoins.total_besoins présent',
    function(){ return !!plan.plan_financement.besoins.total_besoins; }, true);
  chk('plan_financement.ressources.total_ressources présent',
    function(){ return !!plan.plan_financement.ressources.total_ressources; }, true);
  chk('plan_financement.equilibre = true',
    function(){ return plan.plan_financement.equilibre === true; }, true);
  (function(){
    var b = parseInt((plan.plan_financement.besoins.total_besoins||'').replace(/[^0-9]/g,''));
    var r = parseInt((plan.plan_financement.ressources.total_ressources||'').replace(/[^0-9]/g,''));
    chk('Besoins = Ressources = 35 000 €', function(){ return b === r && b === 35000; }, true);
  })();

  // 3. Trésorerie 12 mois
  chk('tresorerie.tableau_12_mois a exactement 12 mois',
    function(){ return plan.tresorerie.tableau_12_mois.length === 12; }, true);
  chk('Chaque mois a solde_cumule',
    function(){ return plan.tresorerie.tableau_12_mois.every(function(m){ return !!m.solde_cumule; }); }, true);

  // 4. Projections revenus 12 mois
  chk('projections_revenus.tableau_mensuel_an1 a 12 entrées',
    function(){ return plan.projections_revenus.tableau_mensuel_an1.length === 12; }, true);
  chk('Chaque mois a ca_ht et resultat_net',
    function(){ return plan.projections_revenus.tableau_mensuel_an1.every(function(m){ return !!m.ca_ht && !!m.resultat_net; }); }, true);

  // 5. Bilan 3 ans
  chk('bilan_previsionnel.annee_1 a actif et passif',
    function(){ return !!plan.bilan_previsionnel.annee_1.actif && !!plan.bilan_previsionnel.annee_1.passif; }, true);
  chk('bilan_previsionnel.annee_2 présent',
    function(){ return !!plan.bilan_previsionnel.annee_2; }, true);
  chk('bilan_previsionnel.annee_3 présent',
    function(){ return !!plan.bilan_previsionnel.annee_3; }, true);
  chk('annee_1 a compte_resultat',
    function(){ return !!plan.bilan_previsionnel.annee_1.compte_resultat; }, true);
  chk('annee_1 a ratios',
    function(){ return !!plan.bilan_previsionnel.annee_1.ratios; }, true);

  // 6. Tableau amortissement 27 000 €
  chk('tableau_amortissement.parametres présent',
    function(){ return !!plan.tableau_amortissement.parametres; }, true);
  chk('Capital emprunté = 27 000 €',
    function(){ return plan.tableau_amortissement.parametres.capital_emprunte.indexOf('27') !== -1; }, true);
  chk('echeancier_annuel a 5 années',
    function(){ return plan.tableau_amortissement.echeancier_annuel.length === 5; }, true);
  chk('An5 capital_restant = 0 €',
    function(){ return plan.tableau_amortissement.echeancier_annuel[4].capital_restant_du_fin_annee === '0 €'; }, true);
  chk('analyse_remboursement présent',
    function(){ return !!plan.tableau_amortissement.analyse_remboursement; }, true);

  // 7. Checklist bancabilité — 6 catégories
  chk('annexes_checklist a exactement 6 catégories',
    function(){ return Object.keys(plan.annexes_checklist).length === 6; }, true);
  chk('Catégorie 4 = Autorisations sectorielles',
    function(){ return plan.annexes_checklist.categorie_4.titre.indexOf('Autorisations') !== -1; }, true);
  chk('HACCP présent dans checklist cat4',
    function(){ return plan.annexes_checklist.categorie_4.items.some(function(i){ return i.document.indexOf('HACCP') !== -1; }); }, true);
  chk('Licence IV présente dans checklist cat4',
    function(){ return plan.annexes_checklist.categorie_4.items.some(function(i){ return i.document.indexOf('licence IV') !== -1 || i.document.indexOf('alcoolisées') !== -1; }); }, true);

  // 8. Disclaimer
  chk('disclaimer.message_entrepreneur présent',
    function(){ return !!plan.disclaimer && !!plan.disclaimer.message_entrepreneur; }, true);
  chk('disclaimer.message_entrepreneur.corps non vide',
    function(){ return plan.disclaimer.message_entrepreneur.corps.length > 20; }, true);
  chk('ressources_gratuites présentes',
    function(){ return plan.disclaimer.ressources_gratuites_recommandees.length >= 3; }, false);

  // 9. Scénarios 3
  chk('scenarios.pessimiste présent',
    function(){ return !!plan.projections_revenus.scenarios.pessimiste; }, true);
  chk('scenarios.realiste présent',
    function(){ return !!plan.projections_revenus.scenarios.realiste; }, true);
  chk('scenarios.optimiste présent',
    function(){ return !!plan.projections_revenus.scenarios.optimiste; }, true);
  chk('Chaque scénario a ca_an1 et ca_an3',
    function(){
      var s = plan.projections_revenus.scenarios;
      return ['pessimiste','realiste','optimiste'].every(function(k){ return !!s[k].ca_an1 && !!s[k].ca_an3; });
    }, true);

  // 10. Autorisations sectorielles
  chk('demarches_administratives contient HACCP',
    function(){ return plan.demarches_administratives.some(function(d){ return d.etape.indexOf('HACCP') !== -1; }); }, true);
  chk('demarches_administratives contient permis exploitation / licence IV',
    function(){ return plan.demarches_administratives.some(function(d){ return d.etape.indexOf('licence IV') !== -1 || d.etape.indexOf('exploitation') !== -1; }); }, true);
  chk('demarches_administratives contient autorisation domaine public',
    function(){ return plan.demarches_administratives.some(function(d){ return d.etape.toLowerCase().indexOf('domaine public') !== -1; }); }, true);

  return { checks: checks, issues: issues };
}

// ── AFFICHER LES RÉSULTATS DU DIAGNOSTIC ─────────────────────────────
var diag = runDiagnostic(TEST_PLAN);
var okCount = diag.checks.filter(function(c){ return c.ok; }).length;
var totalCount = diag.checks.length;
var critFail = diag.issues.filter(function(i){ return i.critical; }).length;

var dbgEl = document.getElementById('dbg-checks');
if (diag.issues.length === 0) {
  dbgEl.style.color = '#81c784';
  dbgEl.textContent = '✓ ' + okCount + '/' + totalCount + ' checks OK — Aucun problème détecté';
} else {
  dbgEl.style.color = critFail > 0 ? '#ef5350' : '#ffb74d';
  dbgEl.textContent = '⚠ ' + okCount + '/' + totalCount + ' OK — ' + diag.issues.length + ' problème(s) ' + (critFail > 0 ? '(' + critFail + ' critiques)' : '');
  var nullEl = document.getElementById('null-list');
  nullEl.classList.add('has-issues');
  nullEl.innerHTML = '<strong>⚠ CHAMPS PROBLÉMATIQUES DÉTECTÉS</strong><br><br>' +
    diag.issues.map(function(i){
      return (i.critical ? '🔴 CRITIQUE' : '🟡 Attention') + ' — ' + i.label;
    }).join('<br>');
}

// Log détaillé en console
console.group('🔍 DIAGNOSTIC RENDERER v3.0 — El Camión Tacos');
diag.checks.forEach(function(c){
  if (c.ok) console.log('✅', c.label);
  else console.warn('❌', c.label, c.critical ? '[CRITIQUE]' : '[mineur]');
});
console.groupEnd();
</script>
